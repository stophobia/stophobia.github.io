<script>

inputBoxHtml = document.getElementById('inputBox').innerHTML;
var showNo;

function replyBoxShow() {
	document.getElementById('inputBox').innerHTML = inputBoxHtml;
}

function replyBoxHidden() {
	document.getElementById('inputBox').innerHTML = "";
}

function replyBoxChange(no) {
	if(!showNo) {
		replyBoxHidden();
	} else if(showNo != no) {
		obj = eval(document.getElementById('reply_'+showNo));
		obj.innerHTML = "";
	}
}


function showReply(no) {
	replyBoxChange(no);		// 현재 열려있는 박스 삭제
	showNo = no;					// 현재 열려있는 박스 넘버 저장

	obj = eval(document.getElementById('reply_'+no));
	obj.innerHTML = inputBoxHtml;

	// 리플에 필요한 값 저장
	frm = document.form;
	frm.eCmtSNo.value = no;
	frm.proMode.value	=	"ins";
	frm.eCmtIsReply.value = 1;

}
</script>

	<script>
	// request 객체 생성
	var req = null;
	function create_request() {
			var request = null;
			try {
					request = new XMLHttpRequest();
			} catch (trymicrosoft) {
					try {
							request = new ActiveXObject("Msxml12.XMLHTTP");
					} catch (othermicrosoft) {
							try {
									request = new ActiveXObject("Microsoft.XMLHTTP");
							} catch (failed) {
									request = null;
							}
					}
			}
			if (request == null)
					alert("Error creating request object!");
			else
					return request;
	}

	// 아작스 호출
	function eventAjaxLoad() {

		// 백그라운드로 DB 추출.
		param = "type=update&eventNo=<?=$eventNo?>";
		req = create_request();
		req.open("POST", "/pages/u01/eventAjax2.php", true);
		req.setRequestHeader("Content-Type", "application/x-www-form-urlencoded;charset=UTF-8");
		req.setRequestHeader("Cache-Control","no-cache, must-revalidate");
		req.setRequestHeader("Pragma","no-cache");
		req.send(param);
		req.onreadystatechange = function () {
			printHTML3();
		}

	}

	function printHTML3() {
		if (req.readyState == 4 && req.status == 200) {
			if(!req.responseText.match('Bad Request')) { // 연결 불안정 메세지는 출력하지 않음.
				document.getElementById('eventAjax').innerHTML = req.responseText;
			}
		}
	}

	eventAjaxLoad()
	</script>
