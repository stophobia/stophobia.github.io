				</div>

				<div class="appLink" style="width: 100px;">
					<a href="http://onetrip.org/quip?pass"><img src="images/app-quip-small.png" /><br />Quip<br /><span>Daily quotes</span></a>
				</div>
				
				<div class="appLink" style="width: 100px;">
					<a href="http://icanlol.com/iphone"><img src="images/app-icanhas-small.png" /><br />I Can Has<br />Cheezburger</a>

				</div>

					<a href="javascript:_goInfo();"><img src="images/icon-info-small.png" /><br />More Info</a>
				</div>

					<p>
						<table class="btnMid" border="0" cellpadding="0" cellspacing="0" onclick="document.location='http://onetrip.org/apps/desktop.php';" style="width: 100%;">

								<td class="midRight"></td>
							</tr>
						</table>
					</p>
					<p>
						<table class="btnMid" border="0" cellpadding="0" cellspacing="0" onclick="document.location='http://onetripblog.blogspot.com'" style="width: 100%;">

								<td class="midLeft"></td>

							</tr>
						</table>
					</p>
					<p>
						<table class="btnMid" border="0" cellpadding="0" cellspacing="0" onclick="document.location.href = 'mailto:neven.mrgan@gmail.com?subject=Feedback from iPhone web apps';" style="width: 100%;">
